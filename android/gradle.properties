org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# The app's id on the phone and on Google Play. It can never change once the
# app has been uploaded to Play. ANDROID_PACKAGE in src/lib/android.ts must say
# the same (tests/unit/android.test.ts checks).
hisabApplicationId=io.github.fr_ost.hisab

# The address of the Hisab site this app opens, like https://hisab.example
# (https, no path). The HISAB_URL environment variable, which CI fills from the
# repository variable of that name, wins over this line.
hisabUrl=
